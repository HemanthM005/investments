name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Investment-Portfolio-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: 📱 APK Build #${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            ## Investment Portfolio Android APK

            **Download:** Click on the `.apk` file above

            **Installation:**
            1. Transfer APK to your Android phone
            2. Go to Settings → Security → Enable "Unknown Sources"
            3. Tap the APK file to install
            4. App opens → auto-connects to cloud ✓

            **Share with Users:**
            - Upload this APK to Google Drive / Dropbox
            - Share the link
            - Users follow the installation steps above

            **Build Info:**
            - Built from: ${{ github.sha }}
            - Timestamp: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
