name: Build Android APK with Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cimg/android:latest
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Release APK
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK as Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Investment-Portfolio-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: 📱 APK Build #${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            ## Investment Portfolio Android APK

            **Download:** Click on `app-release.apk` above

            **Installation Steps:**
            1. Transfer APK to your Android phone
            2. Go to Settings → Security → Enable "Unknown Sources"
            3. Tap the APK file to install
            4. App opens → auto-connects to cloud ✓

            **Share with Users:**
            - Upload this APK to Google Drive / Dropbox
            - Share the download link
            - Users follow installation steps above

            **Build Details:**
            - Built from: ${{ github.sha }}
            - Build #: ${{ github.run_number }}
            - Timestamp: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Failure Notification
        if: failure()
        run: echo "❌ APK build failed. Check logs above for details."
